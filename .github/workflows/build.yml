
name: Build JARVIS firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e t_embed_cc1101

      - name: Add boot_app0
        run: |
          set -e
          BOOT_APP0=$(find ~/.platformio/packages -name boot_app0.bin -print -quit)
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin nao encontrado"
            exit 1
          fi
          cp "$BOOT_APP0" .pio/build/t_embed_cc1101/boot_app0.bin
          echo "boot_app0.bin adicionado!"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-LILYGO-firmware
          path: .pio/build/t_embed_cc1101/
          if-no-files-found: error
          
